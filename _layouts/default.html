<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body{% if page.dark %} class="dark"{% endif %}>
    <div class="page {{ page.main_class | default: 'text' }}">
      {% include nav.html %}
      <main>
        {{ content }}
      </main>
    </div>
    {%- if page.script %}
    <script defer src="{{ page.script | relative_url }}"></script>
    {%- endif %}
  </body>
</html>
