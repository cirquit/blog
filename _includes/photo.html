{%- comment -%}
Inline photo for a normal post. No JavaScript.
Usage:
  {% include photo.html src="/assets/photos/foo.webp" alt="Alt text" caption="Optional caption" %}
Only `src` is required.
{%- endcomment -%}
<figure class="photo-inline">
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt }}" loading="lazy">
  {%- if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
