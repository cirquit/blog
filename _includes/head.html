<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% seo %}

  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="{{ "/assets/fonts/source-serif-4-400.woff2" | relative_url }}">

  <style>
    @font-face {
      font-family: 'Source Serif 4';
      font-style: normal; font-weight: 400; font-display: swap;
      src: url({{ "/assets/fonts/source-serif-4-400.woff2" | relative_url }}) format('woff2');
    }
    @font-face {
      font-family: 'Source Serif 4';
      font-style: italic; font-weight: 400; font-display: swap;
      src: url({{ "/assets/fonts/source-serif-4-400italic.woff2" | relative_url }}) format('woff2');
    }
    @font-face {
      font-family: 'Source Serif 4';
      font-style: normal; font-weight: 600; font-display: swap;
      src: url({{ "/assets/fonts/source-serif-4-600.woff2" | relative_url }}) format('woff2');
    }
    {{ "@import 'main';" | scssify }}
  </style>

  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon-32x32.png" | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/favicon-16x16.png" | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/apple-touch-icon.png" | relative_url }}">

  {% feed_meta %}
</head>
