# ─────────────────────────────────────────────────────────────
#  SITE IDENTITY  —  edit these 4, then rebuild
# ─────────────────────────────────────────────────────────────
title:          My Blog                       # TODO: your blog's name (shown in the header + browser tab)
description:    "A personal blog."             # TODO: one line, used in SEO tags + the RSS feed
author:
  name:         Your Name                      # TODO: used in the RSS feed + SEO metadata
  email:        ""                             #       optional; leave "" to omit
  url:          ""                             #       optional; your homepage, leave "" to omit

# ─────────────────────────────────────────────────────────────
#  WHERE THE SITE LIVES  —  edit when you publish / add a domain
# ─────────────────────────────────────────────────────────────
url:            "https://cirquit.github.io"    # scheme + host, no trailing slash
baseurl:        "/blog"                        # subpath. "/blog" for cirquit.github.io/blog
                                               # set to "" once a custom domain points at the site

# ─────────────────────────────────────────────────────────────
#  BUILD  —  you will rarely touch anything below
# ─────────────────────────────────────────────────────────────
markdown:       kramdown
permalink:      /:year-:month-:day/:title      # post URL shape, e.g. /2026-09-06/hello
paginate:       5                              # posts per page on /blog/ (the home page)

include:
  - _pages

collections:
  galleries:
    output: true                               # _galleries/<slug>.md  ->  /galleries/<slug>/
    permalink: /galleries/:path/
  photos:
    output: true                               # _photos/<slug>/<NN>.md  ->  /galleries/<slug>/<NN>/
    permalink: /galleries/:path/

defaults:
  - scope: { type: galleries }
    values: { layout: gallery, main_class: wide }
  - scope: { type: photos }
    values: { layout: photo, main_class: wide, script: /assets/js/photo-nav.js }

plugins:
  - jekyll-feed                                # generates /feed.xml
  - jekyll-paginate                            # home-page pagination
  - jekyll-seo-tag                             # <title>, OpenGraph, JSON-LD

sass:
  sass_dir:     _sass
  style:        compressed
  silence_deprecations:
    - import                                   # scssify compiles `@import 'main'` in head.html

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - mise.toml
  - scripts
