title:          "blog"
description:    "personal writing and photography"
author:
  name:         alex
  email:        ""
  url:          ""

url:            "https://aerben.me"
baseurl:        ""

markdown:       kramdown
permalink:      /writing/:title
paginate:       5
paginate_path:  /writing/page:num/

collections:
  series:
    output: true                               # _series/<slug>.md -> /series/<slug>/
    permalink: /series/:path/
  photos:
    output: true                               # _photos/<slug>/<NN>.md -> /series/<slug>/<NN>/
    permalink: /series/:path/

defaults:
  - scope: { type: series }
    values: { layout: series }
  - scope: { type: photos }
    values: { layout: photo, dark: true, main_class: reader, script: /assets/js/photo-nav.js }

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag

sass:
  sass_dir:     _sass
  style:        compressed
  silence_deprecations:
    - import                                   # head.html compiles `@import 'main'`

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE
  - mise.toml
  - scripts
